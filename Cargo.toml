[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "now", "serde"] }
maxnines-desktop-kit = { path = "crates/kit" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"
