# Formatting, lints and tests on every pull request and on main. A commit on a
# branch with a pull request runs once, for the pull request, and a newer push
# cancels the run for the one before it. Building the packages, running the app on
# a desktop and installing it on each system wait for a version tag (release.yml),
# which runs these first too, on the commit it releases.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests
    # The oldest GTK 4.6 and libadwaita 1.1 the app supports.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install GTK and libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
