[package]
name = "maxnines-desktop-kit"
description = "What MaxNines Desktop for Linux knows without a desktop: the server's API, signing in, and what's worth a notification"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
base64 = "0.23.1"
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
thiserror = "2.0.21"
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "json"] }
url = "2.5.8"
