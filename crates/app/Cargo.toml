[package]
name = "maxnines-desktop"
description = "MaxNines Desktop for Linux: your MaxNines server's alerts in the tray"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# libadwaita 1.1 and GTK 4.6 at the least, as Ubuntu 22.04 has.
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_1"] }
async-channel = "2.5.0"
gethostname = "1.1.0"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_6"] }
keyring = "4.2.0"
# Blocking, on its own thread, with no async runtime of ours to share.
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
maxnines-desktop-kit.workspace = true
notify-rust = "4.19.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
